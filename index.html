    <!-- Structured Data: FAQPage (matches visible FAQ text in src/app/page.tsx exactly) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is the business name generator free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — UniqueBusinessName.com is 100% free. There are no hidden fees, no credit card required, and no limit on the number of spins. Generate as many business name ideas as you need, completely free of charge."
          }
        },
        {
          "@type": "Question",
          "name": "Can I trademark a name I get from this tool?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The names generated by this tool are not pre-cleared for trademark. Before attempting to register a name with the USPTO (or your country's equivalent), you must conduct a thorough trademark search. A name that appears brandable may already be in use. We strongly recommend consulting a trademark attorney before filing."
          }
        },
        {
          "@type": "Question",
          "name": "How do I check if a business name is already taken?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Start with a free search on the USPTO TESS database (tmsearch.uspto.gov) for trademark conflicts. Also check your state's Secretary of State business name database for entity registrations. Finally, search Google and run a domain availability check — a name with an available .com domain is a strong signal it's not heavily used."
          }
        },
        {
          "@type": "Question",
          "name": "How does the business name generator work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We maintain a curated database of highly brandable names across dozens of industries. When you select a category — such as Tech, Bakery, or Fitness — the tool selects a random subset of names and loads them onto the wheel. Our physics engine then simulates realistic angular momentum, friction, and deceleration to pick a winner in a visually satisfying spin."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use this tool for things other than business names?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely. Switch to Daily Choices mode at /decision-wheel to enter your own custom options for any random decision — from picking a restaurant to choosing a workout. Or visit /spirit-animal for a fun spirit animal reveal. All three modes use the same physics-driven wheel."
          }
        },
        {
          "@type": "Question",
          "name": "What makes a good business name?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The best business names are short (1-3 syllables), easy to spell, easy to pronounce, and meaningful or evocative. They should have an available .com domain, no existing trademark conflicts, and no negative connotations in other languages if you plan to operate internationally. Avoid overly generic names that are hard to protect legally."
          }
        }
      ]
    }
    </script>
